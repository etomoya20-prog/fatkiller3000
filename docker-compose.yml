services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fatkiller3000
    working_dir: /app
    command: ["python", "-u", "main.py"]
    restart: unless-stopped

    # PostgreSQL живёт на хосте, а не в контейнере — экономим память сервера.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    env_file:
      - .env

    environment:
      PYTHONUNBUFFERED: "1"
      TZ: "Europe/Moscow"
      DB_HOST: "host.docker.internal"
      DB_PORT: "5432"

    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'python.*main.py' >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

    # Сервер общий и памяти на нём мало — ограничиваем аппетит контейнера.
    deploy:
      resources:
        limits:
          memory: 512M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    labels:
      - "autoheal=true"
